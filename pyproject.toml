[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callgate"
version = "0.1.0"
description = "Consent-gated reminder calls on Twilio: consent store, dial gate, opt-out handling, quiet hours, webhook signature checks, retries and a decision log."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Art Akopian" }]
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100"]

[project.scripts]
callgate = "callgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The formatter handles wrapping; long string literals are left alone.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
